<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Vendas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        .produto-img {
            max-width: 100%;
            border-radius: 10px;
        }
        .botao-comprar {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #28a745;
            color: white;
            text-decoration: none;
            font-size: 20px;
            border-radius: 5px;
        }
        .botao-comprar:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Produto Incrível!</h1>
        <img class="produto-img" src="https://via.placeholder.com/500" alt="Imagem do Produto">
        <p>Transforme sua vida com este produto revolucionário! Não perca essa oportunidade única.</p>
        <a href="SEU_LINK_DE_PAGAMENTO" class="botao-comprar">Comprar Agora</a>
    </div>
</body>
</html>
